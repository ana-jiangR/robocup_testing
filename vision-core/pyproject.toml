[project]
name = "vision-core"
version = "0.1.0"
description = "Shared camera, field geometry and drawing floor for the robotics skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
