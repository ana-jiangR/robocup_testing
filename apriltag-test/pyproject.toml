[project]
name = "apriltag-test"
version = "0.1.0"
description = "Virtual-field AprilTag tracking: a RoboCup proof of concept"
readme = "README.md"
authors = [
    { name = "Ana Jiang", email = "ana.jiangvz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
]

[project.scripts]
selfcheck = "apriltag_test.selfcheck:main"
serve-tag = "apriltag_test.serve_tag:main"
track = "apriltag_test.track:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
