[project]
name = "tag-tracking"
version = "0.1.0"
description = "Virtual-field AprilTag tracking: a RoboCup proof of concept"
readme = "README.md"
# pupil-apriltags ships prebuilt wheels for cp310-cp313 only. On 3.14 pip
# compiles it from source and the result is missing apriltag.dll, so the
# tracker dies at import. Fail at resolve time instead.
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pupil-apriltags>=1.0.4.post11",
    "vision-core",
]

[project.scripts]
selfcheck = "tag_tracking.selfcheck:main"
serve-tag = "tag_tracking.serve_tag:main"
track = "tag_tracking.track:main"
calibrate-camera = "tag_tracking.calibrate_camera:main"
calibrate-field = "tag_tracking.calibrate_field:main"

[tool.uv.sources]
vision-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
